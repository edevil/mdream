name: pnpm lockfile rewrite repro

on:
  push:
    branches:
      - ci/pnpm-rewrite-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1

      # Deliberately without `cache: pnpm`, so the only pnpm invocations are the
      # ones the experiment makes itself.
      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Run experiment
        run: bash .github/pnpm-repro.sh
